<!DOCTYPE html>
<html>
<head>
<title>Health Optimization Program</title>
<style>
  body {
    font-family: sans-serif;
    background-color: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .container {
    background-color: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    text-align: center;
    max-width: 500px;
    position: relative;
    overflow: hidden;
  }
  .container::before {
    content: '';
    position: absolute;
    top: -50px;
    right: -50px;
    width: 150px;
    height: 150px;
    border: 3px dashed #a0c4ff;
    border-radius: 50%;
    transform: rotate(45deg);
    animation: dash-move 10s infinite linear;
  }

  @keyframes dash-move {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  h1 {
    color: #2c3e50;
    font-size: 2em;
    margin-bottom: 15px;
  }
  h2 {
    color: #5d6d7e;
    font-size: 1.1em;
    margin-bottom: 30px;
    line-height: 1.5;
    font-weight: normal;
  }
  .button {
    background-color: #3498db;
    color: white;
    padding: 15px 30px;
    border: none;
    border-radius: 10px;
    font-size: 1.1em;
    cursor: pointer;
    transition: background-color 0.3s ease;
    margin-bottom: 25px;
    display: inline-block;
  }
  .button:hover {
    background-color: #2980b9;
  }
  .text-input {
    width: calc(100% - 40px);
    padding: 15px 20px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 1em;
    box-sizing: border-box;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Health Optimization Program Participation</h1>
  <h2>Join our exciting health optimization program and report back your initial score from our health survey partner - StayHealthy</h2>
  <button class="button">Start Survey</button>
  <input type="text" class="text-input" placeholder="Enter your health profile score">
  <h4> </h4>
  <input type="text" class="text-input" placeholder="Enter your health recommendation">
</div>

</body>
</html>
